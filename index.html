  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

style=\"color:#1e293b; text-decoration:none;\">Was es kann<\u002Fa>\n      <a href=\"#offen-a\" style=\"color:#1e293b; text-decoration:none;\">Datenschutz<\u002Fa>\n      <a href=\"#kontakt-a\" style=\"color:#1e293b; text-decoration:none;\">Kontakt<\u002Fa>\n    <\u002Fdiv>\n    <a href=\"{{ editorUrl }}\" target=\"_blank\" style=\"background:#2563eb; color:#fff; font-weight:700; font-size:14px; text-decoration:none; padding:9px 16px; border:2.5px solid #1a1a1a; border-radius:8px; box-shadow:3px 3px 0 #1a1a1a;\">Editor öffnen<\u002Fa>\n  <\u002Fdiv>\n\n  <!-- HERO -->\n  <div style=\"display:grid; grid-template-columns:1.05fr .95fr; gap:48px; align-items:center; padding:64px 40px 56px;\">\n    <div>\n      <span style=\"display:inline-block; background:#F7D94C; border:2px solid #1a1a1a; border-radius:999px; padding:4px 14px; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; box-shadow:2px 2px 0 #1a1a1a; transform:rotate(-1.5deg);\">Hackdays in Schulen &amp; Makerspaces<\u002Fspan>\n\n      <sc-if value=\"{{ isA }}\" hint-placeholder-val=\"{{ true }}\">\n        <h1 style=\"font-family:'Pixelify Sans',cursive; font-size:50px; line-height:1.04; margin:20px 0 18px; letter-spacing:-.01em;\">Hardware programmieren mit Blöcken — im Browser, <span style=\"background:#F7D94C; box-shadow:0 -2px 0 #1a1a1a inset, 0 3px 0 #F7D94C; padding:0 4px;\">ohne Löten.<\u002Fspan><\u002Fh1>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isB }}\" hint-placeholder-val=\"{{ false }}\">\n        <h1 style=\"font-family:'Pixelify Sans',cursive; font-size:46px; line-height:1.05; margin:20px 0 18px; letter-spacing:-.01em;\">Ein Hackday. Echte Projekte zum Mitnehmen. <span style=\"background:#F7D94C; box-shadow:0 -2px 0 #1a1a1a inset, 0 3px 0 #F7D94C; padding:0 4px;\">Kein Löten, keine Installation, kein Konto.<\u002Fspan><\u002Fh1>\n      <\u002Fsc-if>\n\n      <p style=\"font-size:18px; color:#1e293b; margin:0 0 26px; max-width:54ch;\">makerSpaceOS ist eine visuelle Programmierumgebung für Hackdays in Schulen und Makerspaces. Blöcke verbinden, per USB auf den Mikrocontroller laden, läuft sofort. Im Hintergrund entsteht echter Python-Code.<\u002Fp>\n\n      <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:14px;\">\n        <a href=\"{{ editorUrl }}\" target=\"_blank\" style=\"background:#2563eb; color:#fff; font-family:'Pixelify Sans',cursive; font-size:19px; text-decoration:none; padding:14px 28px; border:2.5px solid #1a1a1a; border-radius:10px; box-shadow:4px 4px 0 #1a1a1a;\">Editor ausprobieren<\u002Fa>\n        <a href=\"#kontakt-a\" style=\"background:#fff; color:#111; font-weight:700; font-size:15px; text-decoration:none; padding:13px 22px; border:2.5px solid #1a1a1a; border-radius:10px; box-shadow:4px 4px 0 #1a1a1a;\">Test-Kit anfragen<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:8px; margin-top:14px; font-size:13.5px; color:#475569;\">\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#475569\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M2 12h20M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18\"><\u002Fpath><\u002Fsvg>\n        Läuft direkt im Browser — in Chrome oder Edge am Laptop/PC.\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- BLOCK STACK ILLUSTRATION (sticker) -->\n    <div style=\"display:flex; justify-content:center;\">\n      <div style=\"position:relative; width:330px; transform:rotate(1.5deg);\">\n        <div style=\"position:absolute; inset:-14px -14px -14px -14px; background:#fff; border:2.5px solid #1a1a1a; border-radius:16px; box-shadow:7px 7px 0 #1a1a1a;\"><\u002Fdiv>\n        <div style=\"position:relative; padding:6px 4px;\">\n          <!-- purple setup -->\n          <div style=\"position:relative; background:#A57BC3; color:#fff; border:2.5px solid #1a1a1a; border-radius:9px; padding:12px 14px;\">\n            <div style=\"font-weight:800; font-size:13px; letter-spacing:.04em;\">SETUP<\u002Fdiv>\n            <div style=\"font-size:12px; opacity:.92;\">läuft einmal beim Start<\u002Fdiv>\n          <\u002Fdiv>\n          <!-- coral block 1 -->\n          <div style=\"position:relative; background:#E98685; color:#fff; border:2.5px solid #1a1a1a; border-radius:9px; padding:11px 14px; margin-top:8px; display:flex; align-items:center; gap:10px;\">\n            <span style=\"position:absolute; top:-8px; left:22px; width:26px; height:9px; background:#E98685; border:2.5px solid #1a1a1a; border-bottom:none; border-radius:4px 4px 0 0;\"><\u002Fspan>\n            <span style=\"font-weight:700; font-size:13px;\">NeoPixel Farbe:<\u002Fspan>\n            <span style=\"display:inline-flex; align-items:center; gap:6px; background:#fff; color:#111; border:2px solid #1a1a1a; border-radius:6px; padding:3px 9px; font-size:12px; font-weight:700;\"><span style=\"width:11px; height:11px; border-radius:50%; background:#E24D3D; border:1.5px solid #1a1a1a;\"><\u002Fspan>Rot<\u002Fspan>\n          <\u002Fdiv>\n          <!-- coral wait -->\n          <div style=\"position:relative; background:#E98685; color:#fff; border:2.5px solid #1a1a1a; border-radius:9px; padding:11px 14px; margin-top:8px; display:flex; align-items:center; gap:9px;\">\n            <span style=\"position:absolute; top:-8px; left:22px; width:26px; height:9px; background:#E98685; border:2.5px solid #1a1a1a; border-bottom:none; border-radius:4px 4px 0 0;\"><\u002Fspan>\n            <span style=\"font-weight:700; font-size:13px;\">Warte<\u002Fspan>\n            <span style=\"background:#fff; color:#111; border:2px solid #1a1a1a; border-radius:6px; padding:2px 10px; font-size:12px; font-weight:700;\">1<\u002Fspan>\n            <span style=\"font-weight:700; font-size:13px;\">Sekunden<\u002Fspan>\n          <\u002Fdiv>\n          <!-- coral block 2 -->\n          <div style=\"position:relative; background:#E98685; color:#fff; border:2.5px solid #1a1a1a; border-radius:9px; padding:11px 14px; margin-top:8px; display:flex; align-items:center; gap:10px;\">\n            <span style=\"position:absolute; top:-8px; left:22px; width:26px; height:9px; background:#E98685; border:2.5px solid #1a1a1a; border-bottom:none; border-radius:4px 4px 0 0;\"><\u002Fspan>\n            <span style=\"font-weight:700; font-size:13px;\">NeoPixel Farbe:<\u002Fspan>\n            <span style=\"display:inline-flex; align-items:center; gap:6px; background:#fff; color:#111; border:2px solid #1a1a1a; border-radius:6px; padding:3px 9px; font-size:12px; font-weight:700;\"><span style=\"width:11px; height:11px; border-radius:50%; background:#4AB8A6; border:1.5px solid #1a1a1a;\"><\u002Fspan>Grün<\u002Fspan>\n          <\u002Fdiv>\n          <!-- teal forever -->\n          <div style=\"position:relative; background:#4AB8A6; color:#fff; border:2.5px solid #1a1a1a; border-radius:9px; padding:11px 14px; margin-top:8px;\">\n            <span style=\"position:absolute; top:-8px; left:22px; width:26px; height:9px; background:#4AB8A6; border:2.5px solid #1a1a1a; border-bottom:none; border-radius:4px 4px 0 0;\"><\u002Fspan>\n            <span style=\"font-weight:800; font-size:13px; letter-spacing:.03em;\">FÜR IMMER<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- EDITOR DIREKT AUSPROBIEREN -->\n  <div style=\"background:#F3EDE1; border-top:2px solid #1a1a1a; border-bottom:2px solid #1a1a1a; padding:56px 40px;\">\n    <div style=\"display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;\">\n      <span style=\"font-family:'Pixelify Sans',cursive; font-size:15px; background:#4FBFE8; border:2px solid #1a1a1a; border-radius:999px; padding:3px 12px; box-shadow:2px 2px 0 #1a1a1a;\">Live<\u002Fspan>\n      <h2 style=\"font-family:'Pixelify Sans',cursive; font-size:38px; margin:0; line-height:1.05;\">Editor direkt ausprobieren<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:17px; color:#1e293b; margin:14px 0 28px; max-width:70ch;\">Kein Download, keine Installation, kein Konto. Du öffnest den Editor, verbindest Blöcke und lädst dein Programm direkt auf das Board. Probier es jetzt aus — auch ohne Hardware kannst du im Editor herumbauen.<\u002Fp>\n\n    <!-- browser window mockup -->\n    <div style=\"border:2.5px solid #1a1a1a; border-radius:12px; box-shadow:6px 6px 0 #1a1a1a; overflow:hidden; background:#fff;\">\n      <div style=\"display:flex; align-items:center; gap:8px; padding:10px 14px; background:#fff; border-bottom:2px solid #1a1a1a;\">\n        <span style=\"width:12px; height:12px; border-radius:50%; background:#E24D3D; border:1.5px solid #1a1a1a;\"><\u002Fspan>\n        <span style=\"width:12px; height:12px; border-radius:50%; background:#F7D94C; border:1.5px solid #1a1a1a;\"><\u002Fspan>\n        <span style=\"width:12px; height:12px; border-radius:50%; background:#4AB8A6; border:1.5px solid #1a1a1a;\"><\u002Fspan>\n        <span style=\"margin-left:12px; flex:1; max-width:520px; background:#FBF8F3; border:1.5px solid #1a1a1a; border-radius:6px; padding:4px 12px; font-size:12px; color:#475569; font-family:'JetBrains Mono',monospace; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;\">kidslab.codeberg.page/MakerSpaceOS-Editor<\u002Fspan>\n      <\u002Fdiv>\n      <a href=\"{{ editorUrl }}\" target=\"_blank\" style=\"display:block;\">\n        <img src=\"4616cb7e-6ce0-4c96-91cb-6ce49b4fae25\" alt=\"makerSpaceOS Editor: Blöcke links, generierter Python-Code rechts\" style=\"width:100%; display:block;\">\n      <\u002Fa>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:18px; margin-top:26px;\">\n      <a href=\"{{ editorUrl }}\" target=\"_blank\" style=\"background:#2563eb; color:#fff; font-family:'Pixelify Sans',cursive; font-size:19px; text-decoration:none; padding:14px 28px; border:2.5px solid #1a1a1a; border-radius:10px; box-shadow:4px 4px 0 #1a1a1a;\">Jetzt im Browser starten<\u002Fa>\n      <div style=\"display:flex; gap:10px; align-items:flex-start; max-width:46ch; background:#fff; border:2px solid #1a1a1a; border-left:6px solid #E24D3D; border-radius:8px; padding:10px 14px; font-size:13.5px; color:#1e293b;\">\n        <span>Zum Aufspielen aufs Board braucht es Chrome oder Edge an einem Laptop/PC (Web&nbsp;Serial). Auf iPad, Safari und Firefox funktioniert das Übertragen nicht.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- WAS ES KANN -->\n  <div id=\"kann-a\" style=\"background:#fff; border-top:2px solid #1a1a1a; border-bottom:2px solid #1a1a1a; padding:56px 40px;\">\n    <h2 style=\"font-family:'Pixelify Sans',cursive; font-size:36px; margin:0 0 6px;\">Was es kann<\u002Fh2>\n    <p style=\"font-size:16px; color:#475569; margin:0 0 32px;\">Ehrlich sortiert — was heute schon geht und was noch kommt.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:16px;\">\n      <sc-for list=\"{{ features }}\" as=\"f\" hint-placeholder-count=\"6\">\n        <div style=\"background:#FBF8F3; border:2px solid #1a1a1a; border-radius:12px; padding:20px 22px;\">\n          <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:8px;\">\n            <h3 style=\"font-family:'Pixelify Sans',cursive; font-size:19px; margin:0; line-height:1.1;\">{{ f.title }}<\u002Fh3>\n            <sc-if value=\"{{ f.da }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"margin-left:auto; font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:#0f6b5c; background:#d8f0ea; border:1.5px solid #0f6b5c; border-radius:999px; padding:2px 10px; white-space:nowrap;\">Jetzt nutzbar<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ f.kommt }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"margin-left:auto; font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:#8a4d00; background:#fde3c2; border:1.5px solid #8a4d00; border-radius:999px; padding:2px 10px; white-space:nowrap;\">In Vorbereitung<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <p style=\"font-size:14.5px; color:#1e293b; margin:0; line-height:1.55;\">{{ f.text }}<\u002Fp>\n          <sc-if value=\"{{ f.note }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-size:12.5px; color:#8a4d00; margin:8px 0 0; line-height:1.4;\">{{ f.note }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- HARDWARE -->\n  <div style=\"padding:56px 40px;\">\n    <h2 style=\"font-family:'Pixelify Sans',cursive; font-size:36px; margin:0 0 6px;\">Hardware<\u002Fh2>\n    <p style=\"font-size:16px; color:#475569; margin:0 0 32px;\">Niedrige Einstiegskosten — ein Board reicht. Grove und günstige KY-Bauteile lassen sich anschließen.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:18px;\">\n      <div style=\"position:relative; background:#fff; border:2.5px solid #1a1a1a; border-radius:12px; padding:24px; box-shadow:4px 4px 0 #1a1a1a;\">\n        <span style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#0f6b5c; background:#d8f0ea; border:1.5px solid #0f6b5c; border-radius:999px; padding:2px 10px;\">Jetzt nutzbar<\u002Fspan>\n        <h3 style=\"font-family:'Pixelify Sans',cursive; font-size:24px; margin:12px 0 6px;\">Maker Pi RP2040<\u002Fh3>\n        <p style=\"font-size:14.5px; color:#1e293b; margin:0 0 12px;\">Ein günstiges Board ab 15 €, das fast alles schon mitbringt: Motortreiber, zwei Taster, zwei NeoPixel-LEDs, sieben Grove-Anschlüsse, Servo-Anschlüsse, Buzzer. Mehr braucht der Einstieg nicht.<\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; gap:8px;\">\n          <span style=\"font-size:12px; background:#FBF8F3; border:1.5px solid #1a1a1a; border-radius:6px; padding:3px 9px;\">7× Grove<\u002Fspan>\n          <span style=\"font-size:12px; background:#FBF8F3; border:1.5px solid #1a1a1a; border-radius:6px; padding:3px 9px;\">Motortreiber<\u002Fspan>\n          <span style=\"font-size:12px; background:#FBF8F3; border:1.5px solid #1a1a1a; border-radius:6px; padding:3px 9px;\">2× NeoPixel<\u002Fspan>\n          <span style=\"font-size:12px; background:#FBF8F3; border:1.5px solid #1a1a1a; border-radius:6px; padding:3px 9px;\">Buzzer<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative; background:#fff; border:2.5px dashed #94a3b8; border-radius:12px; padding:24px;\">\n        <span style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#8a4d00; background:#fde3c2; border:1.5px solid #8a4d00; border-radius:999px; padding:2px 10px;\">In Vorbereitung<\u002Fspan>\n        <h3 style=\"font-family:'Pixelify Sans',cursive; font-size:24px; margin:12px 0 6px; color:#475569;\">Robo ESP32<\u002Fh3>\n        <p style=\"font-size:14.5px; color:#475569; margin:0;\">Dasselbe Board mit ESP32-Chip — schaltet Funk, WLAN und IoT frei. In Vorbereitung.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- OFFEN & DATENSPARSAM -->\n  <div id=\"offen-a\" style=\"padding:0 40px 56px;\">\n    <div style=\"position:relative; background:#4AB8A6; color:#fff; border:2.5px solid #1a1a1a; border-radius:16px; box-shadow:6px 6px 0 #1a1a1a; padding:40px; overflow:hidden;\">\n      <div style=\"display:grid; grid-template-columns:1.4fr 1fr; gap:32px; align-items:center;\">\n        <div>\n          <span style=\"display:inline-block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; background:#fff; color:#0f6b5c; border:2px solid #1a1a1a; border-radius:999px; padding:3px 12px; box-shadow:2px 2px 0 #1a1a1a;\">Für deutsche Schulen gebaut<\u002Fspan>\n          <h2 style=\"font-family:'Pixelify Sans',cursive; font-size:34px; margin:16px 0 12px; color:#fff;\">Offen und datensparsam<\u002Fh2>\n          <p style=\"font-size:16px; margin:0; line-height:1.6; color:#f0fbf8;\">makerSpaceOS ist Open Source und läuft als statische Seite auf Codeberg Pages. Es gibt keinen Server, kein Konto und keine Anmeldung. Es werden keine Schülerdaten gespeichert oder übertragen — alles passiert lokal im Browser.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px;\">\n          <div style=\"background:#fff; color:#111; border:2.5px solid #1a1a1a; border-radius:10px; padding:14px 16px; box-shadow:3px 3px 0 #1a1a1a; display:flex; align-items:center; gap:12px;\">\n            <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0f6b5c\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n            <div><div style=\"font-family:'Pixelify Sans',cursive; font-size:16px;\">Open Source<\u002Fdiv><div style=\"font-size:12.5px; color:#475569;\">Lizenz wird vor Veröffentlichung festgelegt<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <a href=\"https://codeberg.org\" target=\"_blank\" style=\"background:#111; color:#fff; border:2.5px solid #1a1a1a; border-radius:10px; padding:14px 16px; box-shadow:3px 3px 0 #1a1a1a; display:flex; align-items:center; gap:12px; text-decoration:none;\">\n            <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"#fff\"><path d=\"M12 2 2 19.7h20L12 2Zm0 4.6 5.9 10.3-5.9-2-5.9 2L12 6.6Z\"><\u002Fpath><\u002Fsvg>\n            <div><div style=\"font-family:'Pixelify Sans',cursive; font-size:16px;\">Auf Codeberg ansehen<\u002Fdiv><div style=\"font-size:12.5px; color:#cbd5e1;\">Quellcode &amp; Issues<\u002Fdiv><\u002Fdiv>\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- TEST-KIT / KONTAKT -->\n  <div id=\"kontakt-a\" style=\"background:#F3EDE1; border-top:2px solid #1a1a1a; padding:56px 40px;\">\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center;\">\n      <div>\n        <h2 style=\"font-family:'Pixelify Sans',cursive; font-size:34px; margin:0 0 12px;\">Test-Kit anfragen<\u002Fh2>\n        <p style=\"font-size:16px; color:#1e293b; margin:0 0 22px; max-width:48ch;\">Du willst makerSpaceOS an deiner Schule oder in deinem Makerspace ausprobieren? Melde dich — wir besprechen gemeinsam, welche Hardware passt und wie ein Hackday damit ablaufen kann.<\u002Fp>\n        <a href=\"mailto:team@kidslab.de?subject=Test-Kit%20makerSpaceOS\" style=\"background:#2563eb; color:#fff; font-family:'Pixelify Sans',cursive; font-size:19px; text-decoration:none; padding:14px 28px; border:2.5px solid #1a1a1a; border-radius:10px; box-shadow:4px 4px 0 #1a1a1a; display:inline-block;\">Kontakt aufnehmen<\u002Fa>\n        <p style=\"font-size:13.5px; color:#475569; margin:14px 0 0;\">oder direkt an <a href=\"mailto:team@kidslab.de\" style=\"color:#2563eb; font-weight:600;\">team@kidslab.de<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:2.5px solid #1a1a1a; border-radius:12px; padding:24px; box-shadow:5px 5px 0 #1a1a1a;\">\n        <div style=\"display:flex; flex-direction:column; gap:12px;\">\n          <div><label style=\"font-size:13px; font-weight:600; display:block; margin-bottom:5px;\">Name<\u002Flabel><input type=\"text\" placeholder=\"Dein Name\" style=\"width:100%; padding:10px 12px; border:2px solid #1a1a1a; border-radius:7px; font:inherit; font-size:14px; background:#FBF8F3;\"><\u002Fdiv>\n          <div><label style=\"font-size:13px; font-weight:600; display:block; margin-bottom:5px;\">Schule / Einrichtung<\u002Flabel><input type=\"text\" placeholder=\"z. B. Mittelschule Musterstadt\" style=\"width:100%; padding:10px 12px; border:2px solid #1a1a1a; border-radius:7px; font:inherit; font-size:14px; background:#FBF8F3;\"><\u002Fdiv>\n          <div><label style=\"font-size:13px; font-weight:600; display:block; margin-bottom:5px;\">Nachricht<\u002Flabel><textarea placeholder=\"Was hast du vor?\" rows=\"3\" style=\"width:100%; padding:10px 12px; border:2px solid #1a1a1a; border-radius:7px; font:inherit; font-size:14px; background:#FBF8F3; resize:vertical;\"><\u002Ftextarea><\u002Fdiv>\n          <button onclick=\"{{ submitContact }}\" style=\"background:#F7D94C; color:#111; font-family:'Pixelify Sans',cursive; font-size:17px; border:2.5px solid #1a1a1a; border-radius:9px; box-shadow:3px 3px 0 #1a1a1a; padding:12px; cursor:pointer;\">Anfrage senden<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- WER DAHINTER STEHT + FAQ -->\n  <div style=\"background:#fff; border-top:2px solid #1a1a1a; padding:56px 40px;\">\n    <div style=\"display:grid; grid-template-columns:1fr 1.25fr; gap:48px; align-items:start;\">\n      <div>\n        <h2 style=\"font-family:'Pixelify Sans',cursive; font-size:32px; margin:0 0 14px;\">Wer dahinter steht<\u002Fh2>\n        <p style=\"font-size:16px; color:#1e293b; margin:0 0 18px; line-height:1.6;\">Entstanden beim KidsLab Nürnberg aus drei Jahren Hackday-Praxis. Die Auswahl an Bauteilen und Blöcken stammt aus rund 80 echten Teilnehmer-Projekten — also aus dem, was mit Kindern wirklich funktioniert.<\u002Fp>\n        <div style=\"display:inline-flex; align-items:center; gap:12px; background:#FBF8F3; border:2px solid #1a1a1a; border-radius:10px; padding:12px 16px;\">\n          <img src=\"b8b098e2-b2f0-4263-9230-a43c4fdb79e1\" alt=\"\" style=\"width:34px; height:auto;\">\n          <div style=\"font-size:13.5px; color:#475569; line-height:1.4;\"><strong style=\"color:#111;\">~80 Projekte<\u002Fstrong><br>aus echter Hackday-Praxis<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <h2 style=\"font-family:'Pixelify Sans',cursive; font-size:32px; margin:0 0 16px;\">FAQ<\u002Fh2>\n        <div style=\"display:flex; flex-direction:column; gap:10px;\">\n          <sc-for list=\"{{ faqs }}\" as=\"faq\" hint-placeholder-count=\"6\">\n            <details style=\"background:#FBF8F3; border:2px solid #1a1a1a; border-radius:9px; padding:0;\">\n              <summary style=\"cursor:pointer; list-style:none; padding:14px 16px; font-family:'Pixelify Sans',cursive; font-size:17px; display:flex; align-items:center; justify-content:space-between; gap:12px;\">{{ faq.q }}<span style=\"font-size:20px; line-height:1;\">+<\u002Fspan><\u002Fsummary>\n              <div style=\"padding:0 16px 16px; font-size:14.5px; color:#1e293b; line-height:1.55;\">{{ faq.a }}<\u002Fdiv>\n            <\u002Fdetails>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FOOTER -->\n  <div style=\"background:#111; color:#cbd5e1; padding:40px; display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:32px; font-size:14px;\">\n    <div>\n      <span style=\"font-family:'Pixelify Sans',cursive; font-size:22px; color:#fff;\">makerSpaceOS<\u002Fspan>\n      <p style=\"margin:10px 0 0; font-size:13px; line-height:1.6; color:#94a3b8;\">Ein Projekt der KidsLab — Digitale Bildung gGmbH.<br>kidslab.de<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:8px;\">\n      <div style=\"font-family:'Pixelify Sans',cursive; font-size:15px; color:#fff; margin-bottom:2px;\">Projekt<\u002Fdiv>\n      <a href=\"{{ editorUrl }}\" target=\"_blank\" style=\"color:#cbd5e1; text-decoration:none;\">Editor<\u002Fa>\n      <a href=\"https://codeberg.org\" target=\"_blank\" style=\"color:#cbd5e1; text-decoration:none;\">Codeberg / Quellcode<\u002Fa>\n      <a href=\"mailto:team@kidslab.de\" style=\"color:#cbd5e1; text-decoration:none;\">Kontakt<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:8px;\">\n      <div style=\"font-family:'Pixelify Sans',cursive; font-size:15px; color:#fff; margin-bottom:2px;\">Rechtliches<\u002Fdiv>\n      <a href=\"#\" style=\"color:#cbd5e1; text-decoration:none;\">Impressum<\u002Fa>\n      <a href=\"#\" style=\"color:#cbd5e1; text-decoration:none;\">Datenschutzerklärung<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:900},&quot;headlineVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;A&quot;,&quot;B&quot;],&quot;default&quot;:&quot;A&quot;,&quot;tsType&quot;:&quot;'A'|'B'&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const variant = this.props.headlineVariant || 'A';\n    const editorUrl = 'https://kidslab.codeberg.page/MakerSpaceOS-Editor';\n    const steps = [\n      { n: '1', color: '#F39A1B', title: 'Projekt wählen', text: 'Team bilden, Idee aussuchen.' },\n      { n: '2', color: '#A57BC3', title: 'Mit Blöcken bauen', text: 'Bunte Blöcke verbinden, Schritt für Schritt.' },\n      { n: '3', color: '#4AB8A6', title: 'Aufs Board laden', text: 'Per USB, ein Klick, läuft sofort. Kein Kompilieren, kein Warten.' },\n      { n: '4', color: '#E24D3D', title: 'Mitnehmen', text: 'Die Hardware bleibt beim Kind. Das gebaute Projekt geht mit nach Hause.' },\n    ];\n    const features = [\n      { da: true, title: 'Blöcke, die mitwachsen', text: 'Anfangen mit Blöcken, bei Bedarf eigenen Code schreiben oder Anpassungen machen. Wächst vom Einstieg bis zum freien Programmieren mit.' },\n      { da: true, title: 'Kein Löten, günstige Bauteile', text: 'Grove-Module zum Einstecken oder günstige KY-Bauteile mit Jumper-Kabeln. Vorhandenes Grove-Material lässt sich weiternutzen.' },\n      { da: true, title: 'Läuft komplett im Browser', text: 'Anonym, ohne Konto, ohne Server.' },\n      { da: true, title: 'Speichern ohne Konto', text: 'Projekte werden automatisch im Browser gesichert und lassen sich dauerhaft aufs Board schreiben.', note: 'Projekt-Export als Datei: in Vorbereitung.' },\n      { da: true, title: 'KI-Block-Helfer', text: 'Erzeugt einzelne Bausteine als Hilfe, aber das Kind behält Ablauf, Logik und Regeln selbst in der Hand. Keine Maschine, die das Programm fertig macht.' },\n      { kommt: true, title: 'Funk, WLAN und IoT', text: 'Mit dem Robo-ESP32-Board — in Vorbereitung.' },\n    ];\n    const faqs = [\n      { q: 'Welche Geräte brauche ich?', a: 'Laptop oder PC mit Chrome oder Edge. Kein iPad — siehe Geräte-Hinweis.' },\n      { q: 'Was kostet die Hardware pro Kind?', a: 'Board ab 15 €, dazu wenige günstige Bauteile.' },\n      { q: 'Brauche ich als Lehrkraft Programmierkenntnisse?', a: 'Nein.' },\n      { q: 'Ab welchem Alter?', a: 'Ab ca. 9 Jahren.' },\n      { q: 'Welche Bauteile passen?', a: 'Die meisten gängigen Grove-Sensoren und günstige KY-Module. Hinweis: die Ports liefern 3,3 V, nicht jedes 5-V-Modul läuft automatisch.' },\n      { q: 'Was passiert mit den Daten?', a: 'Nichts verlässt den Browser. Kein Konto, kein Server.' },\n    ];\n    return {\n      editorUrl,\n      steps, features, faqs,\n      isA: variant === 'A',\n      isB: variant === 'B',\n      submitContact: () => { window.location.href = 'mailto:team@kidslab.de?subject=Test-Kit%20makerSpaceOS'; },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
