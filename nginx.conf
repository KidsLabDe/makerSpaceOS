server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /editor → /editor/ (trailing slash normalisieren, damit relative Asset-Pfade des Editors greifen)
    rewrite ^/editor$ /editor/ permanent;

    # Cache-Header für statische Assets
    location ~* \.(js|mjs|css|woff2?|svg|ico|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(png|jpe?g|webp|avif|gif)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Editor (eigener index.html im Unterordner)
    location /editor/ {
        try_files $uri $uri/ /editor/index.html;
    }

    # Landing Page
    location / {
        try_files $uri $uri/ /index.html;
    }
}
