# JS/CSS & Co. nur dann dauerhaft cachen, wenn die URL einen Versions-Stempel
# trägt (?v=… aus scripts/bump_cache.js) – ein neuer Stempel = neue URL.
# Ohne Stempel (z. B. vendor/) fragt der Browser jedes Mal nach (meist 304).
map $arg_v $static_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Standard für alles ohne eigene Regel – vor allem die HTML-Seiten, aber auch
    # lib/*.py, firmware/*.uf2, docs: Der Browser darf cachen, muss aber vor jeder
    # Nutzung beim Server nachfragen (ETag → 304, kostet kaum etwas). Ohne diesen
    # Header rät der Browser selbst eine Frische-Dauer (heuristisches Caching) und
    # zeigt nach einem Deploy teils tagelang die alte index.html mit alten ?v=-Stempeln.
    # Hinweis: Locations mit eigenem add_header erben diesen Header nicht.
    add_header Cache-Control "no-cache";

    # /editor → /editor/ (trailing slash normalisieren, damit relative Asset-Pfade des Editors greifen)
    rewrite ^/editor$ /editor/ permanent;

    # Cache-Header für statische Assets (siehe map $static_cache oben)
    location ~* \.(js|mjs|css|woff2?|svg|ico|json)$ {
        add_header Cache-Control $static_cache;
        try_files $uri =404;
    }
    location ~* \.(png|jpe?g|webp|avif|gif)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Editor (eigener index.html im Unterordner)
    location /editor/ {
        try_files $uri $uri/ /editor/index.html;
    }

    # Landing Page
    location / {
        try_files $uri $uri/ /index.html;
    }
}
